name: Verify proofs and manuscript

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - run: python scripts/check_axioms.py
      - run: python scripts/check_repository.py

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: qsp_paper.tex
          working_directory: paper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manuscript-pdf
          path: paper/qsp_paper.pdf
          if-no-files-found: error
